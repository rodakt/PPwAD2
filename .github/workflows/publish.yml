on:
  push:
    branches: [rok_akademicki_26] # Zmienione na Twoją aktywną gałąź
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Opcjonalne: jeśli Twoje .qmd mają wykonywać kod Pythona, 
      # tutaj musiałbyś dodać krok instalacji Pythona i bibliotek.
      # Na razie zakładamy renderowanie statyczne (bez uruchamiania kodu).
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbformat nbconvert numpy pandas matplotlib seaborn

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}